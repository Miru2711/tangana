// Original illustrated façade study informed by Old Havana architectural references.
// Canvas artwork is drawn locally; no third-party photos are embedded.
function makeHavanaFacade(){
 const c=document.createElement('canvas');c.width=256;c.height=512;
 const p=c.getContext('2d');
 const wall=p.createLinearGradient(0,0,256,512);wall.addColorStop(0,'#e7b86d');wall.addColorStop(.5,'#f3c982');wall.addColorStop(1,'#d99861');

 // deterministic weathered plaster brush marks
 for(let i=0;i<850;i++){let x=(i*97+13)%256,y=(i*193+17)%512;
 p.fillStyle=i%3===0?'rgba(111,65,51,.10)':'rgba(255,247,199,.14)';p.fillRect(x,y,3+(i%8),1+(i%12));}
 const line=(x,y,w,h,color)=>{p.fillStyle=color;p.fillRect(x,y,w,h)};
 // roofline and carved stucco cornices
 line(0,0,256,14,'#483c3d');line(0,14,256,17,'#fff0bc');line(0,31,256,7,'#946d55');
 line(0,42,256,5,'#7d5a50');line(0,249,256,15,'#fff0bc');line(0,264,256,7,'#57464a');
 // narrow columns divide the facade into a rhythmic Havana streetscape
 for(const x of [6,124,243]){line(x,48,9,445,'#fff0bd');line(x+7,48,4,445,'#7c6155')}
 // arched upper windows with wooden shutters and ink outlines
 function arch(x,y,w,h){p.fillStyle='#493d42';p.beginPath();p.moveTo(x,y+h);p.lineTo(x,y+w/2);p.arc(x+w/2,y+w/2,w/2,Math.PI,0);p.lineTo(x+w,y+h);p.closePath();p.fill();
 p.fillStyle='#304c5b';p.beginPath();p.moveTo(x+7,y+h-6);p.lineTo(x+7,y+w/2+6);p.arc(x+w/2,y+w/2+6,w/2-7,Math.PI,0);p.lineTo(x+w-7,y+h-6);p.closePath();p.fill();
 line(x+w/2-3,y+w/2,6,h-w/2,'#e9bf80');line(x+7,y+h*.66,w-14,5,'#e9bf80');
 for(const xx of [x+15,x+w-21]){line(xx,y+w*.65,7,h-w*.65-9,'#7d6652')}
 p.strokeStyle='#fff0bd';p.lineWidth=5;p.beginPath();p.arc(x+w/2,y+w/2,w/2+5,Math.PI,0);p.stroke();}
 arch(22,75,89,150);arch(144,75,89,150);
 // wrought iron balconies: rails, balusters and scroll details
 for(const y of [211,220,231])line(13,y,230,5,'#34343a');
 for(let x=20;x<241;x+=13){line(x,215,4,34,'#33323b');p.strokeStyle='#33323b';p.lineWidth=2;p.beginPath();p.arc(x+6,232,5,0,Math.PI*2);p.stroke()}
 // arcaded ground floor; dark recessed doorways
 for(const x of [18,140]){p.fillStyle='#554348';p.beginPath();p.moveTo(x,489);p.lineTo(x,354);p.arc(x+49,354,49,Math.PI,0);p.lineTo(x+98,489);p.fill();
 p.fillStyle='#43686d';p.fillRect(x+9,357,80,131);for(let j=0;j<5;j++)line(x+12+j*16,368,5,119,'#304e55');
 p.strokeStyle='#ffe7b1';p.lineWidth=9;p.beginPath();p.arc(x+49,354,49,Math.PI,0);p.stroke();}
 line(0,491,256,21,'#574c4b');
 return c;
}
const havanaFacade=makeHavanaFacade();

function render(){
 const w=canvas.width,h=canvas.height;
 // Sky and pavement are drawn separately from the raycast walls.

 // Painted cartoon clouds, gently drifting with camera direction.

 const street=ctx.createLinearGradient(0,h/2,0,h);street.addColorStop(0,'#b99b7e');street.addColorStop(1,'#8e7565');ctx.fillStyle=street;ctx.fillRect(0,h/2,w,h/2);
 // Inked paving stones become smaller toward the horizon.
 ctx.strokeStyle='rgba(52,43,41,.27)';ctx.lineWidth=Math.max(1,w/500);for(let row=1;row<9;row++){const yy=h/2+(h/2)*(row/9)**1.6;ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(w,yy);ctx.stroke();const spacing=20+row*24;for(let x=((row%2)*spacing/2);x<w;x+=spacing){ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(w/2+(x-w/2)*1.13,Math.min(h,yy+12+row*2));ctx.stroke()}}
 
 const fov=Math.PI/2.85,columns=Math.min(w,480),colW=w/columns; const depth=new Float32Array(columns);
 for(let i=0;i<columns;i++){
  const angle=player.a+Math.atan((2*i/columns-1)*Math.tan(fov/2)),dx=Math.cos(angle),dy=Math.sin(angle);
  let mapX=Math.floor(player.x),mapY=Math.floor(player.y);
  const ddx=Math.abs(1/(dx||1e-9)),ddy=Math.abs(1/(dy||1e-9)),sx=dx<0?-1:1,sy=dy<0?-1:1;
  let distX=(dx<0?player.x-mapX:mapX+1-player.x)*ddx,distY=(dy<0?player.y-mapY:mapY+1-player.y)*ddy,side=0;

   if(distX<distY){distX+=ddx;mapX+=sx;side=0}else{distY+=ddy;mapY+=sy;side=1}
   if(solid(mapX+.5,mapY+.5))break;
  }
  const distance=Math.max(.08,side===0?distX-ddx:distY-ddy),corrected=Math.max(.08,distance*Math.cos(angle-player.a));

  const tile=level[mapY]?.[mapX]||'1',hit=side===0?player.y+distance*dy:player.x+distance*dx,textureX=hit-Math.floor(hit);
  const colors={'1':[222,194,147],'2':[244,177,99],'3':[103,184,176],'4':[226,130,121],'5':[171,159,203]};
  const base=colors[tile]||colors['1'];
  const mortar=textureX<.035||((Math.floor((top+wallHeight*.25)/Math.max(1,wallHeight/5))%2===0)&&textureX>.96);
  const shade=Math.max(.30,1-corrected*.055-(side?.12:0));
  const r=Math.floor(base[0]*shade),g=Math.floor(base[1]*shade),b=Math.floor(base[2]*shade);

  }
  ctx.fillStyle=`rgb(${r},${g},${b})`;ctx.fillRect(x,top,cw,wallHeight);

  if(textureX<.028||textureX>.975){ctx.fillStyle='rgba(39,37,41,.77)';ctx.fillRect(x,top,cw,wallHeight)}
  if(textureX>.055&&textureX<.95&&Math.floor(textureX*31)%7===0){ctx.fillStyle='rgba(255,241,207,.10)';ctx.fillRect(x,top,cw,wallHeight)}
  ctx.fillStyle='rgba(37,34,38,.8)';ctx.fillRect(x,top,cw,Math.max(2,h*.004));
  // A scalloped roofline is painted into each colorful building.
  if(tile!=='1'&&textureX>.08&&textureX<.92){ctx.fillStyle='#f6e1ad';ctx.fillRect(x,top+wallHeight*.065,cw,Math.max(2,wallHeight*.025));ctx.fillStyle='#453b3e';ctx.fillRect(x,top+wallHeight*.092,cw,Math.max(1,wallHeight*.008))}
  
  // Hand-built architectural details: horizontal cornice and inset window bands.
  if(tile!=='1'){
   ctx.fillStyle=`rgba(53,48,46,${Math.min(.8,.25+shade*.3)})`;
   for(let k=1;k<=2;k++)ctx.fillRect(x,top+wallHeight*k/6,cw,Math.max(1,wallHeight*.014));
   const windowStripe=textureX>.24&&textureX<.74;
   if(windowStripe){
    ctx.fillStyle='#3a333c';ctx.fillRect(x,top+wallHeight*.285,cw,wallHeight*.255);ctx.fillRect(x,top+wallHeight*.64,cw,wallHeight*.195);
    ctx.fillStyle='#385c6c';ctx.fillRect(x,top+wallHeight*.305,cw,wallHeight*.215);ctx.fillRect(x,top+wallHeight*.66,cw,wallHeight*.155);
    // Gold balcony rails and carved lintels.
    ctx.fillStyle='#f7d6a1';ctx.fillRect(x,top+wallHeight*.278,cw,Math.max(2,wallHeight*.018));ctx.fillRect(x,top+wallHeight*.55,cw,Math.max(2,wallHeight*.018));
    ctx.fillStyle='#352f35';ctx.fillRect(x,top+wallHeight*.555,cw,Math.max(2,wallHeight*.018));
    if(Math.floor(textureX*26)%4===0){ctx.fillStyle='#302e35';ctx.fillRect(x,top+wallHeight*.49,cw,wallHeight*.075)}
   }
   if(textureX>.47&&textureX<.51){ctx.fillStyle='#e3d6b9';ctx.fillRect(x,top+wallHeight*.30,cw,wallHeight*.22)}
  }else{
   ctx.fillStyle='rgba(65,57,50,.30)';for(let k=1;k<=4;k++)ctx.fillRect(x,top+wallHeight*k/5,cw,Math.max(1,wallHeight*.009));
  }
  if(mortar){ctx.fillStyle='rgba(65,52,44,.18)';ctx.fillRect(x,top,cw,wallHeight)}
  ctx.fillStyle='#353139';ctx.fillRect(x,top+wallHeight*.975,cw,Math.max(2,wallHeight*.025));
 }
 // Draw mobile enemy silhouettes back-to-front, clipped by the wall depth buffer.
 const focal=w/(2*Math.tan(fov/2));
 for(const t of targets.filter(t=>t.alive).sort((a,b)=>Math.hypot(b.x-player.x,b.y-player.y)-Math.hypot(a.x-player.x,a.y-player.y))){
  const dx=t.x-player.x,dy=t.y-player.y;
  const front=dx*Math.cos(player.a)+dy*Math.sin(player.a);
  const lateral=-dx*Math.sin(player.a)+dy*Math.cos(player.a);
  if(front<=.15)continue;

  const size=Math.min(h*2,h/(front*.78)*.53);
  const left=center-size/2,top=h/2-size*.42;
  for(let px=Math.max(0,Math.floor(left));px<Math.min(w,Math.ceil(left+size));px+=Math.max(1,Math.ceil(w/columns))){

   if(front>depth[column]+.08)continue;
   const u=(px-left)/size;
   const body=Math.sqrt(Math.max(0,1-Math.pow((u-.5)/.36,2)));
   if(body<=0)continue;
   ctx.fillStyle='#241d24';ctx.fillRect(px,top+size*(.32-.22*body),Math.ceil(w/columns)+1,size*.66*body);
   const face=Math.sqrt(Math.max(0,1-Math.pow((u-.5)/.22,2)));
   if(face>0){ctx.fillStyle='#d2a176';ctx.fillRect(px,top+size*(.24-.17*face),Math.ceil(w/columns)+1,size*.32*face)}

   ctx.fillStyle='#b52d36';ctx.fillRect(px,top+size*.07,Math.ceil(w/columns)+1,size*.025*(t.hp/3));
  }
 }
 if(performance.now()<invulnUntil){ctx.fillStyle='#f02a291b';ctx.fillRect(0,0,w,h)}
 if(gameOver){ctx.fillStyle='#100c10b8';ctx.fillRect(0,h*.32,w,h*.3);ctx.fillStyle='#fff';ctx.font=`bold ${Math.round(w*.075)}px system-ui`;ctx.textAlign='center';ctx.fillText(health<=0?'GAME OVER':'AREA CLEARED',w/2,h*.45);ctx.font=`${Math.round(w*.036)}px system-ui`;ctx.fillText('Tap RESET to play again',w/2,h*.51);ctx.textAlign='start'}
 if(performance.now()<flashUntil){ctx.fillStyle='#ffe3a444';ctx.fillRect(0,0,w,h);ctx.fillStyle='#ffe2a0';ctx.beginPath();ctx.arc(w/2,h/2,17,0,Math.PI*2);ctx.fill()}

 // Original vector weapon art, with animated recoil, machete slash, and cannon kick.

  ctx.rotate(-.14-swing*1.15);ctx.translate(swing*w*.06,-swing*h*.09);

  const iron=ctx.createLinearGradient(-80,0,80,0);iron.addColorStop(0,'#252c2e');iron.addColorStop(.5,'#6d7979');iron.addColorStop(1,'#242d32');ctx.fillStyle=iron;
  ctx.beginPath();ctx.moveTo(-49,-h*.16);ctx.lineTo(-75,-h*.43);ctx.lineTo(75,-h*.43);ctx.lineTo(49,-h*.16);ctx.closePath();ctx.fill();
  ctx.fillStyle='#b99358';ctx.fillRect(-77,-h*.46,154,h*.04);ctx.fillStyle='#182025';ctx.beginPath();ctx.ellipse(0,-h*.43,62,15,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#d5a45b';ctx.lineWidth=5;ctx.stroke();

 }
 ctx.restore();
 for(const p of projectiles){const dx=p.x-player.x,dy=p.y-player.y;const front=dx*Math.cos(player.a)+dy*Math.sin(player.a),lat=-dx*Math.sin(player.a)+dy*Math.cos(player.a);if(front>.1){const cx=w/2+lat/front*(w*.72),r=Math.max(3,Math.min(55,h/(front*15)));ctx.fillStyle='#75512e';ctx.beginPath();ctx.arc(cx,h/2+r*.3,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#c9a26a';ctx.lineWidth=3;ctx.stroke()}}
 // Impact sparks, projected in world space; short lived and automatically removed.
 for(const p of impactBursts){const dx=p.x-player.x,dy=p.y-player.y,front=dx*Math.cos(player.a)+dy*Math.sin(player.a),lat=-dx*Math.sin(player.a)+dy*Math.cos(player.a);if(front>.1){const cx=w/2+lat/front*(w*.72),radius=(1-p.life/.42)*45;ctx.strokeStyle=`rgba(255,207,87,${Math.min(1,p.life*2.4)})`;ctx.lineWidth=5;ctx.beginPath();ctx.arc(cx,h/2,radius,0,Math.PI*2);ctx.stroke()}}
 // Centered reticle.
 ctx.strokeStyle='#ffffffd0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(w/2-8,h/2);ctx.lineTo(w/2+8,h/2);ctx.moveTo(w/2,h/2-8);ctx.lineTo(w/2,h/2+8);ctx.stroke();
}
updateHUD();
function resize(){let scale=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.max(320,Math.floor(innerWidth*scale));canvas.height=Math.max(400,Math.floor(innerHeight*scale));render()}addEventListener('resize',resize);resize();
addEventListener('keydown',e=>{keys.add(e.code);if(e.code==='Space'&&!e.repeat)fire();if(['Digit1','Digit2','Digit3'].includes(e.code))setWeapon(({Digit1:'machete',Digit2:'revolver',Digit3:'cannon'})[e.code]);if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>keys.delete(e.code));function wallDistance(angle){let x=player.x,y=player.y,dx=Math.cos(angle),dy=Math.sin(angle);for(let d=0;d<30;d+=.035){if(solid(x+dx*d,y+dy*d))return d}return 30}
function hurt(t,amount){if(!t.alive)return;t.hp-=amount;hitUntil=performance.now()+180;if(t.hp<=0){t.alive=false;hits++;if(hits===targets.length){gameOver=true;document.getElementById('help').textContent='Area cleared! Tap RESET to retry.'}}updateHUD()}
function fire(){if(gameOver)return;const now=performance.now();const cooldown={machete:380,revolver:330,cannon:1100}[weapon];if(now-lastAttack<cooldown)return;
 if(weapon==='revolver'&&reloadUntil>now)return; if(weapon==='revolver'&&ammo===0){reloadUntil=now+1050;lastAttack=now;shout('RELOADING');updateHUD();return}
 lastAttack=now;shots++;attackUntil=now+280;flashUntil=now+(weapon==='machete'?0:100);
 if(weapon==='revolver')ammo--;
 if(weapon==='cannon'){projectiles.push({x:player.x+Math.cos(player.a)*.4,y:player.y+Math.sin(player.a)*.4,dx:Math.cos(player.a),dy:Math.sin(player.a),life:1.7});updateHUD();return}
 const wall=wallDistance(player.a),range=weapon==='machete'?1.55:25;let chosen=null,best=Infinity;
 for(const t of targets){if(!t.alive)continue;const dx=t.x-player.x,dy=t.y-player.y,front=dx*Math.cos(player.a)+dy*Math.sin(player.a),lateral=Math.abs(-dx*Math.sin(player.a)+dy*Math.cos(player.a));if(front>.1&&front<Math.min(wall+.1,range)&&lateral<(weapon==='machete'?.7:.27)&&front<best){chosen=t;best=front}}
 if(chosen){hurt(chosen,weapon==='machete'?2:1);if(weapon==='machete')shout('¡SUAYABA!');else impactBursts.push({x:chosen.x,y:chosen.y,life:.22})}
 updateHUD();}
function tickProjectiles(dt){for(const p of projectiles){if(p.life<=0)continue;let nx=p.x,ny=p.y;p.life-=dt;let impact=false;const steps=Math.max(1,Math.ceil(dt*6/.12));for(let i=0;i<steps;i++){nx+=p.dx*dt*6/steps;ny+=p.dy*dt*6/steps;if(solid(nx,ny)||targets.some(t=>t.alive&&Math.hypot(t.x-nx,t.y-ny)<.5)){impact=true;break}}if(impact||p.life<=0){p.life=0;impactBursts.push({x:nx,y:ny,life:.42});shout('¡BIMBATA!');flashUntil=performance.now()+120;for(const t of targets){if(t.alive&&Math.hypot(t.x-nx,t.y-ny)<2.2)hurt(t,3)}}else{p.x=nx;p.y=ny}}projectiles=projectiles.filter(p=>p.life>0)}
document.getElementById('fire').addEventListener('pointerdown',e=>{e.preventDefault();fire()});
document.getElementById('reset').onclick=resetGame;
const pad=document.getElementById('pad'),nub=document.getElementById('nub');function padUpdate(e){const b=pad.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2;let x=(e.clientX-cx)/50,y=(e.clientY-cy)/50,len=Math.max(1,Math.hypot(x,y));joyX=x/len;joyY=y/len;nub.style.transform=`translate(${joyX*36}px,${joyY*36}px)`}pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);padUpdate(e)});pad.addEventListener('pointermove',e=>{if(pad.hasPointerCapture(e.pointerId))padUpdate(e)});function stopPad(){joyX=joyY=0;nub.style.transform=''}pad.addEventListener('pointerup',stopPad);pad.addEventListener('pointercancel',stopPad);
const turn=document.getElementById('turn');let lastX=null;turn.addEventListener('pointerdown',e=>{turn.setPointerCapture(e.pointerId);lastX=e.clientX});turn.addEventListener('pointermove',e=>{if(turn.hasPointerCapture(e.pointerId)&&lastX!==null){player.a+=(e.clientX-lastX)*.012;lastX=e.clientX}});turn.addEventListener('pointerup',()=>lastX=null);turn.addEventListener('pointercancel',()=>lastX=null);
function enemyTick(dt,now){if(gameOver)return;
 for(const t of targets){if(!t.alive)continue;
  const dx=player.x-t.x,dy=player.y-t.y,d=Math.hypot(dx,dy);
  if(d<9&&d>1.65){const speed=.65*dt;const vx=dx/d*speed,vy=dy/d*speed;
   if(!solid(t.x+vx+Math.sign(vx)*.2,t.y)&&Math.hypot(t.x+vx-player.x,t.y-player.y)>1.65)t.x+=vx;
   if(!solid(t.x,t.y+vy+Math.sign(vy)*.2)&&Math.hypot(t.x-player.x,t.y+vy-player.y)>1.65)t.y+=vy;
  }
  if(d<1.85&&now>t.attack&&now>invulnUntil){health=Math.max(0,health-10);t.attack=now+1100;invulnUntil=now+650;updateHUD();if(health<=0){gameOver=true;document.getElementById('help').textContent='You were defeated. Tap RESET.';}}
 }
}
let last=performance.now();function frame(now){let dt=Math.min(.04,(now-last)/1000);last=now;let forward=(keys.has('KeyW')||keys.has('ArrowUp')?1:0)-(keys.has('KeyS')||keys.has('ArrowDown')?1:0)-joyY;let strafe=(keys.has('KeyD')?1:0)-(keys.has('KeyA')?1:0)+joyX;let mag=Math.max(1,Math.hypot(forward,strafe));forward/=mag;strafe/=mag;player.a+=((keys.has('ArrowRight')?1:0)-(keys.has('ArrowLeft')?1:0))*dt*2.2;let speed=dt*2.6;if(!gameOver)move((Math.cos(player.a)*forward-Math.sin(player.a)*strafe)*speed,(Math.sin(player.a)*forward+Math.cos(player.a)*strafe)*speed);if(reloadUntil&&now>=reloadUntil){ammo=6;reloadUntil=0;updateHUD()}impactBursts=impactBursts.filter(p=>(p.life-=dt)>0);if(!gameOver)tickProjectiles(dt);else projectiles=[];enemyTick(dt,now);render();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
