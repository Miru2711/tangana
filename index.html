<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>TÁNGANA · Foundation 0.1</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0d12;color:white;font-family:system-ui;touch-action:none}canvas{width:100vw;height:100dvh;display:block;image-rendering:pixelated}#label{position:fixed;top:env(safe-area-inset-top,0px);left:12px;background:#10131acc;border:1px solid #fff6;padding:9px 12px;font-weight:800;letter-spacing:.08em}#help{position:fixed;top:53px;left:12px;font-size:12px;color:#e6e6e6;background:#10131a99;padding:5px}#pad{position:fixed;bottom:32px;left:20px;width:138px;height:138px;border:3px solid #ffffff9c;border-radius:50%;background:#ffffff1c;touch-action:none}#nub{position:absolute;width:60px;height:60px;left:36px;top:36px;background:#f4ead4c9;border-radius:50%;box-shadow:0 0 0 2px #1117}#turn{position:fixed;right:18px;bottom:44px;width:155px;height:122px;border:2px solid #ffffff7d;border-radius:18px;background:#ffffff1c;display:grid;place-items:center;text-align:center;font-size:15px;font-weight:700;touch-action:none}#reset{position:fixed;right:14px;top:15px;background:#151922;color:#fff;border:1px solid #fff7;padding:10px 13px;border-radius:8px}#status{position:fixed;bottom:6px;left:0;right:0;text-align:center;font-size:11px;opacity:.8;pointer-events:none}</style></head><body><canvas id="view"></canvas><div id="label">TÁNGANA · 0.1</div><div id="help">Original raycasting foundation · move and turn</div><button id="reset">RESET</button><div id="pad"><div id="nub"></div></div><div id="turn">DRAG TO TURN<br>↔</div><div id="status">No enemies · No weapons · Engine test</div><script>
'use strict';
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d',{alpha:false});
const level=[
'1111111111111111',
'1000000000000001',
'1011000000110001',
'1000000000000001',
'1000001000000001',
'1000001000000001',
'1000000000000001',
'1000110000110001',
'1000000000000001',
'1000000000000001',
'1000000110000001',
'1000000000000001',
'1111111111111111'];
const player={x:3.5,y:3.5,a:0.4};const keys=new Set();let joyX=0,joyY=0,turnV=0;
function solid(x,y){let xi=Math.floor(x),yi=Math.floor(y);return yi<0||yi>=level.length||xi<0||xi>=level[0].length||level[yi][xi]!=='0'}
function move(dx,dy){let r=.22;if(!solid(player.x+dx+Math.sign(dx)*r,player.y))player.x+=dx;if(!solid(player.x,player.y+dy+Math.sign(dy)*r))player.y+=dy}
function render(){const w=canvas.width,h=canvas.height;ctx.fillStyle='#9eb0c0';ctx.fillRect(0,0,w,h/2);ctx.fillStyle='#454248';ctx.fillRect(0,h/2,w,h/2);const fov=Math.PI/2.85;const columns=Math.min(w,420),colW=w/columns;for(let i=0;i<columns;i++){let angle=player.a+Math.atan((2*i/columns-1)*Math.tan(fov/2));let dx=Math.cos(angle),dy=Math.sin(angle),mapX=Math.floor(player.x),mapY=Math.floor(player.y);let ddx=Math.abs(1/(dx||1e-9)),ddy=Math.abs(1/(dy||1e-9));let sx=dx<0?-1:1,sy=dy<0?-1:1;let distX=(dx<0?player.x-mapX:mapX+1-player.x)*ddx,distY=(dy<0?player.y-mapY:mapY+1-player.y)*ddy;let side=0;for(let step=0;step<35;step++){if(distX<distY){distX+=ddx;mapX+=sx;side=0}else{distY+=ddy;mapY+=sy;side=1}if(solid(mapX+.5,mapY+.5))break}let distance=Math.max(.08,side===0?distX-ddx:distY-ddy);let corrected=distance*Math.cos(angle-player.a);let wallHeight=Math.min(h*3,h/(corrected*.78));let hit=side===0?player.y+distance*dy:player.x+distance*dx;let stripe=(hit-Math.floor(hit));let light=Math.max(45,195-corrected*15-(side?35:0));let variation=(Math.floor(stripe*8)%8===0)?-30:0;let v=Math.max(25,light+variation);ctx.fillStyle=`rgb(${v},${Math.min(255,v+9)},${Math.min(255,v+18)})`;ctx.fillRect(Math.floor(i*colW),Math.floor((h-wallHeight)/2),Math.ceil(colW)+1,Math.ceil(wallHeight));ctx.fillStyle='#131923';ctx.fillRect(Math.floor(i*colW),Math.floor((h-wallHeight)/2),Math.ceil(colW)+1,Math.max(1,h*.003))}ctx.strokeStyle='#ffffffb0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(w/2-8,h/2);ctx.lineTo(w/2+8,h/2);ctx.moveTo(w/2,h/2-8);ctx.lineTo(w/2,h/2+8);ctx.stroke()}
function resize(){let scale=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.max(320,Math.floor(innerWidth*scale));canvas.height=Math.max(400,Math.floor(innerHeight*scale));render()}addEventListener('resize',resize);resize();
addEventListener('keydown',e=>{keys.add(e.code);if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>keys.delete(e.code));document.getElementById('reset').onclick=()=>Object.assign(player,{x:3.5,y:3.5,a:.4});
const pad=document.getElementById('pad'),nub=document.getElementById('nub');function padUpdate(e){const b=pad.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2;let x=(e.clientX-cx)/50,y=(e.clientY-cy)/50,len=Math.max(1,Math.hypot(x,y));joyX=x/len;joyY=y/len;nub.style.transform=`translate(${joyX*36}px,${joyY*36}px)`}pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);padUpdate(e)});pad.addEventListener('pointermove',e=>{if(pad.hasPointerCapture(e.pointerId))padUpdate(e)});function stopPad(){joyX=joyY=0;nub.style.transform=''}pad.addEventListener('pointerup',stopPad);pad.addEventListener('pointercancel',stopPad);
const turn=document.getElementById('turn');let lastX=null;turn.addEventListener('pointerdown',e=>{turn.setPointerCapture(e.pointerId);lastX=e.clientX});turn.addEventListener('pointermove',e=>{if(turn.hasPointerCapture(e.pointerId)&&lastX!==null){player.a+=(e.clientX-lastX)*.012;lastX=e.clientX}});turn.addEventListener('pointerup',()=>lastX=null);turn.addEventListener('pointercancel',()=>lastX=null);
let last=performance.now();function frame(now){let dt=Math.min(.04,(now-last)/1000);last=now;let forward=(keys.has('KeyW')||keys.has('ArrowUp')?1:0)-(keys.has('KeyS')||keys.has('ArrowDown')?1:0)-joyY;let strafe=(keys.has('KeyD')?1:0)-(keys.has('KeyA')?1:0)+joyX;let mag=Math.max(1,Math.hypot(forward,strafe));forward/=mag;strafe/=mag;player.a+=((keys.has('ArrowRight')?1:0)-(keys.has('ArrowLeft')?1:0))*dt*2.2;let speed=dt*2.6;move((Math.cos(player.a)*forward-Math.sin(player.a)*strafe)*speed,(Math.sin(player.a)*forward+Math.cos(player.a)*strafe)*speed);render();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
