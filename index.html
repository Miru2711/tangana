 p.fillStyle='#304c5b';p.beginPath();p.moveTo(x+7,y+h-6);p.lineTo(x+7,y+w/2+6);p.arc(x+w/2,y+w/2+6,w/2-7,Math.PI,0);p.lineTo(x+w-7,y+h-6);p.closePath();p.fill();

 // arcaded ground floor; dark recessed doorways

 line(0,491,256,21,'#574c4b');
 return c;
}
