<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>TÁNGANA · Weapons Test 0.5</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0d12;color:white;font-family:system-ui;touch-action:none}canvas{width:100vw;height:100dvh;display:block;image-rendering:pixelated}#label{position:fixed;top:env(safe-area-inset-top,0px);left:12px;background:#10131acc;border:1px solid #fff6;padding:9px 12px;font-weight:800;letter-spacing:.08em}#help{position:fixed;top:53px;left:12px;font-size:12px;color:#e6e6e6;background:#10131a99;padding:5px}#pad{position:fixed;bottom:32px;left:20px;width:138px;height:138px;border:3px solid #ffffff9c;border-radius:50%;background:#ffffff1c;touch-action:none}#nub{position:absolute;width:60px;height:60px;left:36px;top:36px;background:#f4ead4c9;border-radius:50%;box-shadow:0 0 0 2px #1117}#turn{position:fixed;right:18px;bottom:44px;width:155px;height:122px;border:2px solid #ffffff7d;border-radius:18px;background:#ffffff1c;display:grid;place-items:center;text-align:center;font-size:15px;font-weight:700;touch-action:none}#fire{position:fixed;right:34px;bottom:190px;width:88px;height:88px;border-radius:50%;background:#ba4036e8;color:#fff;border:3px solid #fff9;font-weight:900;font-size:19px;touch-action:none}#score{position:fixed;top:92px;left:12px;background:#10131acc;padding:6px 10px;font-weight:700}#reset{position:fixed;right:14px;top:15px;background:#151922;color:#fff;border:1px solid #fff7;padding:10px 13px;border-radius:8px}#status{position:fixed;bottom:6px;left:0;right:0;text-align:center;font-size:11px;opacity:.8;pointer-events:none}#weapons{position:fixed;left:12px;bottom:184px;display:flex;gap:6px;z-index:3}#weapons button{background:#111b25d9;border:2px solid #ffffff85;border-radius:9px;color:white;font-size:12px;font-weight:800;padding:10px 8px;min-height:44px}#weapons button.selected{border-color:#ffe4a2;background:#6c3d20}#effect{position:fixed;top:29%;left:0;right:0;text-align:center;pointer-events:none;font-size:clamp(28px,8vw,60px);font-weight:1000;color:#fff2aa;text-shadow:3px 4px #402017;opacity:0}#effect.on{opacity:1}</style></head><body><canvas id="view"></canvas><div id="label">TÁNGANA · 0.5.1</div><div id="help">Survive the patrol · aim and fire</div><button id="reset">RESET</button><div id="score">HP 100 · KOs 0 / 4</div><div id="weapons"><button data-weapon="machete" class="selected">1 MACHETE</button><button data-weapon="revolver">2 REVOLVER</button><button data-weapon="cannon">3 CANNON</button></div><div id="effect"></div><button id="fire" aria-label="Fire">FIRE</button><div id="pad"><div id="nub"></div></div><div id="turn">DRAG TO TURN<br>↔</div><div id="status">Weapons test · machete / revolver / coconut cannon</div><script>
'use strict';
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d',{alpha:false});
const level=[
'111111111111111111111111',
'100000000000000000000001',
'102222200000033333000001',
'102000200000030003000001',
'102000200000030003000001',
'102222200000033333000001',
'100000000000000000000001',
'100000000000000000000001',
'100000000000000000000001',
'100000000000000000000001',
'100000000000000000000001',
'100000000000000000000001',
'100000000000000000000001',
'100444400000055555000001',
'100400400000050005000001',
'100400400000050005000001',
'100444400000055555000001',
'100000000000000000000001',
'100000000000000000000001',
'111111111111111111111111'
];
const spawn=[{x:10.5,y:6.5},{x:7.5,y:9.5},{x:14.5,y:10.5},{x:17.5,y:8.5}];
let targets=[];function spawnEnemies(){targets=spawn.map((t,i)=>({...t,alive:true,hp:3,attack:0,phase:i*1.7}));}spawnEnemies();
let health=100,gameOver=false,invulnUntil=0;const scoreEl=document.getElementById('score');
function updateHUD(){scoreEl.textContent=`HP ${Math.ceil(health)} · KOs ${hits}/${targets.length} · ${weapon.toUpperCase()} ${weapon==='revolver'?ammo+'/6':''} · SHOTS ${shots}`;}
function resetGame(){Object.assign(player,{x:10.5,y:10.5,a:-.4});spawnEnemies();health=100;gameOver=false;shots=hits=0;flashUntil=hitUntil=invulnUntil=0;ammo=6;projectiles=[];setWeapon("machete");document.getElementById('help').textContent='Survive the patrol · aim and fire';updateHUD();}
let shots=0,hits=0,flashUntil=0,hitUntil=0,weapon='machete',ammo=6,lastAttack=0,projectiles=[],attackUntil=0;const effect=document.getElementById('effect');let effectTimer;function shout(message){effect.textContent=message;effect.classList.add('on');clearTimeout(effectTimer);effectTimer=setTimeout(()=>effect.classList.remove('on'),450)}function setWeapon(w){weapon=w;document.querySelectorAll('#weapons button').forEach(b=>b.classList.toggle('selected',b.dataset.weapon===w));updateHUD()}document.querySelectorAll('#weapons button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();setWeapon(b.dataset.weapon)}));
const player={x:10.5,y:10.5,a:-.4};const keys=new Set();let joyX=0,joyY=0,turnV=0;
function solid(x,y){let xi=Math.floor(x),yi=Math.floor(y);return yi<0||yi>=level.length||xi<0||xi>=level[0].length||level[yi][xi]!=='0'}
function move(dx,dy){let r=.22;if(!solid(player.x+dx+Math.sign(dx)*r,player.y))player.x+=dx;if(!solid(player.x,player.y+dy+Math.sign(dy)*r))player.y+=dy}
function render(){
 const w=canvas.width,h=canvas.height;
 // Sky and pavement are drawn separately from the raycast walls.
 const sky=ctx.createLinearGradient(0,0,0,h/2);sky.addColorStop(0,'#78b7d5');sky.addColorStop(1,'#d6d4c5');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h/2);
 ctx.fillStyle='#8b8073';ctx.fillRect(0,h/2,w,h/2);
 const fov=Math.PI/2.85,columns=Math.min(w,480),colW=w/columns; const depth=new Float32Array(columns);
 for(let i=0;i<columns;i++){
  const angle=player.a+Math.atan((2*i/columns-1)*Math.tan(fov/2)),dx=Math.cos(angle),dy=Math.sin(angle);
  let mapX=Math.floor(player.x),mapY=Math.floor(player.y);
  const ddx=Math.abs(1/(dx||1e-9)),ddy=Math.abs(1/(dy||1e-9)),sx=dx<0?-1:1,sy=dy<0?-1:1;
  let distX=(dx<0?player.x-mapX:mapX+1-player.x)*ddx,distY=(dy<0?player.y-mapY:mapY+1-player.y)*ddy,side=0;
  for(let step=0;step<48;step++){
   if(distX<distY){distX+=ddx;mapX+=sx;side=0}else{distY+=ddy;mapY+=sy;side=1}
   if(solid(mapX+.5,mapY+.5))break;
  }
  const distance=Math.max(.08,side===0?distX-ddx:distY-ddy),corrected=Math.max(.08,distance*Math.cos(angle-player.a));
  depth[i]=corrected;const wallHeight=Math.min(h*3,h/(corrected*.78)),top=(h-wallHeight)/2;
  const tile=level[mapY]?.[mapX]||'1',hit=side===0?player.y+distance*dy:player.x+distance*dx,textureX=hit-Math.floor(hit);
  const colors={'1':[188,171,145],'2':[232,174,104],'3':[113,181,176],'4':[211,130,122],'5':[174,166,203]};
  const base=colors[tile]||colors['1'];
  const mortar=textureX<.035||((Math.floor((top+wallHeight*.25)/Math.max(1,wallHeight/5))%2===0)&&textureX>.96);
  const shade=Math.max(.30,1-corrected*.055-(side?.12:0));
  const r=Math.floor(base[0]*shade),g=Math.floor(base[1]*shade),b=Math.floor(base[2]*shade);
  const x=Math.floor(i*colW),cw=Math.ceil(colW)+1;
  ctx.fillStyle=`rgb(${r},${g},${b})`;ctx.fillRect(x,top,cw,wallHeight);
  // Hand-built architectural details: horizontal cornice and inset window bands.
  if(tile!=='1'){
   ctx.fillStyle=`rgba(53,48,46,${Math.min(.8,.25+shade*.3)})`;
   for(let k=1;k<=2;k++)ctx.fillRect(x,top+wallHeight*k/6,cw,Math.max(1,wallHeight*.014));
   const windowStripe=textureX>.24&&textureX<.74;
   if(windowStripe){ctx.fillStyle='#273d48';ctx.fillRect(x,top+wallHeight*.30,cw,wallHeight*.22);ctx.fillRect(x,top+wallHeight*.65,cw,wallHeight*.18)}
   if(textureX>.47&&textureX<.51){ctx.fillStyle='#e3d6b9';ctx.fillRect(x,top+wallHeight*.30,cw,wallHeight*.22)}
  }else{
   ctx.fillStyle='rgba(65,57,50,.30)';for(let k=1;k<=4;k++)ctx.fillRect(x,top+wallHeight*k/5,cw,Math.max(1,wallHeight*.009));
  }
  if(mortar){ctx.fillStyle='rgba(65,52,44,.18)';ctx.fillRect(x,top,cw,wallHeight)}
  ctx.fillStyle='#554c42';ctx.fillRect(x,top,cw,Math.max(1,h*.003));
 }
 // Draw mobile enemy silhouettes back-to-front, clipped by the wall depth buffer.
 const focal=w/(2*Math.tan(fov/2));
 for(const t of targets.filter(t=>t.alive).sort((a,b)=>Math.hypot(b.x-player.x,b.y-player.y)-Math.hypot(a.x-player.x,a.y-player.y))){
  const dx=t.x-player.x,dy=t.y-player.y;
  const front=dx*Math.cos(player.a)+dy*Math.sin(player.a);
  const lateral=-dx*Math.sin(player.a)+dy*Math.cos(player.a);
  if(front<=.15)continue;
  const center=w/2+lateral/front*focal;
  const size=Math.min(h*2,h/(front*.78)*.53);
  const left=center-size/2,top=h/2-size*.42;
  for(let px=Math.max(0,Math.floor(left));px<Math.min(w,Math.ceil(left+size));px+=Math.max(1,Math.ceil(w/columns))){
   const column=Math.min(columns-1,Math.floor(px/w*columns));
   if(front>depth[column]+.08)continue;
   const u=(px-left)/size;
   const body=Math.sqrt(Math.max(0,1-Math.pow((u-.5)/.36,2)));
   if(body<=0)continue;
   ctx.fillStyle='#241d24';ctx.fillRect(px,top+size*(.32-.22*body),Math.ceil(w/columns)+1,size*.66*body);
   const face=Math.sqrt(Math.max(0,1-Math.pow((u-.5)/.22,2)));
   if(face>0){ctx.fillStyle='#d2a176';ctx.fillRect(px,top+size*(.24-.17*face),Math.ceil(w/columns)+1,size*.32*face)}
   ctx.fillStyle=t.hp===1?'#c23d3d':'#4e6071';ctx.fillRect(px,top+size*(.48-.15*body),Math.ceil(w/columns)+1,size*.43*body);
   ctx.fillStyle='#b52d36';ctx.fillRect(px,top+size*.07,Math.ceil(w/columns)+1,size*.025*(t.hp/3));
  }
 }
 if(performance.now()<invulnUntil){ctx.fillStyle='#f02a291b';ctx.fillRect(0,0,w,h)}
 if(gameOver){ctx.fillStyle='#100c10b8';ctx.fillRect(0,h*.32,w,h*.3);ctx.fillStyle='#fff';ctx.font=`bold ${Math.round(w*.075)}px system-ui`;ctx.textAlign='center';ctx.fillText(health<=0?'GAME OVER':'AREA CLEARED',w/2,h*.45);ctx.font=`${Math.round(w*.036)}px system-ui`;ctx.fillText('Tap RESET to play again',w/2,h*.51);ctx.textAlign='start'}
 if(performance.now()<flashUntil){ctx.fillStyle='#ffe3a444';ctx.fillRect(0,0,w,h);ctx.fillStyle='#ffe2a0';ctx.beginPath();ctx.arc(w/2,h/2,17,0,Math.PI*2);ctx.fill()}
 if(performance.now()<hitUntil){ctx.strokeStyle='#7eff9c';ctx.lineWidth=5;ctx.strokeRect(w/2-17,h/2-17,34,34)}
 // Stylized first-person weapon silhouettes; original canvas drawings.
 const now=performance.now(),swing=now<attackUntil?Math.sin((attackUntil-now)/280*Math.PI):0;
 ctx.save();ctx.translate(w*.58,h*.93);ctx.rotate(weapon==='machete'?-swing*.9:weapon==='revolver'?-swing*.2:swing*.16);
 if(weapon==='machete'){ctx.fillStyle='#513522';ctx.fillRect(-12,-h*.17,24,h*.25);ctx.fillStyle='#c7d5d8';ctx.beginPath();ctx.moveTo(-10,-h*.17);ctx.lineTo(-20,-h*.53);ctx.lineTo(0,-h*.62);ctx.lineTo(13,-h*.18);ctx.fill();ctx.strokeStyle='#29323b';ctx.lineWidth=4;ctx.stroke()}
 if(weapon==='revolver'){ctx.fillStyle='#332b29';ctx.fillRect(-23,-h*.09,45,h*.16);ctx.fillStyle='#6c747b';ctx.fillRect(-26,-h*.21,54,h*.13);ctx.fillStyle='#adb6b9';ctx.fillRect(-13,-h*.32,26,h*.14);ctx.fillStyle='#323d45';ctx.beginPath();ctx.arc(0,-h*.15,20,0,Math.PI*2);ctx.fill()}
 if(weapon==='cannon'){ctx.fillStyle='#785132';ctx.fillRect(-45,-h*.13,90,h*.25);ctx.fillStyle='#323b3d';ctx.beginPath();ctx.moveTo(-38,-h*.11);ctx.lineTo(-58,-h*.38);ctx.lineTo(58,-h*.38);ctx.lineTo(38,-h*.11);ctx.fill();ctx.fillStyle='#687478';ctx.fillRect(-58,-h*.4,116,h*.045)}
 ctx.restore();
 for(const p of projectiles){const dx=p.x-player.x,dy=p.y-player.y;const front=dx*Math.cos(player.a)+dy*Math.sin(player.a),lat=-dx*Math.sin(player.a)+dy*Math.cos(player.a);if(front>.1){const cx=w/2+lat/front*(w*.72),r=Math.max(3,Math.min(55,h/(front*15)));ctx.fillStyle='#75512e';ctx.beginPath();ctx.arc(cx,h/2+r*.3,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#c9a26a';ctx.lineWidth=3;ctx.stroke()}}
 // Centered reticle.
 ctx.strokeStyle='#ffffffd0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(w/2-8,h/2);ctx.lineTo(w/2+8,h/2);ctx.moveTo(w/2,h/2-8);ctx.lineTo(w/2,h/2+8);ctx.stroke();
}
updateHUD();
function resize(){let scale=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.max(320,Math.floor(innerWidth*scale));canvas.height=Math.max(400,Math.floor(innerHeight*scale));render()}addEventListener('resize',resize);resize();
addEventListener('keydown',e=>{keys.add(e.code);if(e.code==='Space'&&!e.repeat)fire();if(['Digit1','Digit2','Digit3'].includes(e.code))setWeapon(({Digit1:'machete',Digit2:'revolver',Digit3:'cannon'})[e.code]);if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>keys.delete(e.code));function wallDistance(angle){let x=player.x,y=player.y,dx=Math.cos(angle),dy=Math.sin(angle);for(let d=0;d<30;d+=.035){if(solid(x+dx*d,y+dy*d))return d}return 30}
function hurt(t,amount){if(!t.alive)return;t.hp-=amount;hitUntil=performance.now()+180;if(t.hp<=0){t.alive=false;hits++;if(hits===targets.length){gameOver=true;document.getElementById('help').textContent='Area cleared! Tap RESET to retry.'}}updateHUD()}
function fire(){if(gameOver)return;const now=performance.now();const cooldown={machete:380,revolver:330,cannon:1100}[weapon];if(now-lastAttack<cooldown)return;
 if(weapon==='revolver'&&ammo===0){ammo=6;lastAttack=now;shout('RELOAD!');updateHUD();return}
 lastAttack=now;shots++;attackUntil=now+280;flashUntil=now+(weapon==='machete'?0:100);
 if(weapon==='revolver')ammo--;
 if(weapon==='cannon'){projectiles.push({x:player.x+Math.cos(player.a)*.4,y:player.y+Math.sin(player.a)*.4,dx:Math.cos(player.a),dy:Math.sin(player.a),life:1.7});updateHUD();return}
 const wall=wallDistance(player.a),range=weapon==='machete'?1.55:25;let chosen=null,best=Infinity;
 for(const t of targets){if(!t.alive)continue;const dx=t.x-player.x,dy=t.y-player.y,front=dx*Math.cos(player.a)+dy*Math.sin(player.a),lateral=Math.abs(-dx*Math.sin(player.a)+dy*Math.cos(player.a));if(front>.1&&front<Math.min(wall+.1,range)&&lateral<(weapon==='machete'?.7:.27)&&front<best){chosen=t;best=front}}
 if(chosen){hurt(chosen,weapon==='machete'?2:1);if(weapon==='machete')shout('¡SUAYABA!')}
 updateHUD();}
function tickProjectiles(dt){for(const p of projectiles){if(p.life<=0)continue;let nx=p.x,ny=p.y;p.life-=dt;let impact=false;const steps=Math.max(1,Math.ceil(dt*6/.12));for(let i=0;i<steps;i++){nx+=p.dx*dt*6/steps;ny+=p.dy*dt*6/steps;if(solid(nx,ny)||targets.some(t=>t.alive&&Math.hypot(t.x-nx,t.y-ny)<.5)){impact=true;break}}if(impact||p.life<=0){p.life=0;shout('¡BIMBATA!');flashUntil=performance.now()+120;for(const t of targets){if(t.alive&&Math.hypot(t.x-nx,t.y-ny)<2.2)hurt(t,3)}}else{p.x=nx;p.y=ny}}projectiles=projectiles.filter(p=>p.life>0)}
document.getElementById('fire').addEventListener('pointerdown',e=>{e.preventDefault();fire()});
document.getElementById('reset').onclick=resetGame;
const pad=document.getElementById('pad'),nub=document.getElementById('nub');function padUpdate(e){const b=pad.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2;let x=(e.clientX-cx)/50,y=(e.clientY-cy)/50,len=Math.max(1,Math.hypot(x,y));joyX=x/len;joyY=y/len;nub.style.transform=`translate(${joyX*36}px,${joyY*36}px)`}pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);padUpdate(e)});pad.addEventListener('pointermove',e=>{if(pad.hasPointerCapture(e.pointerId))padUpdate(e)});function stopPad(){joyX=joyY=0;nub.style.transform=''}pad.addEventListener('pointerup',stopPad);pad.addEventListener('pointercancel',stopPad);
const turn=document.getElementById('turn');let lastX=null;turn.addEventListener('pointerdown',e=>{turn.setPointerCapture(e.pointerId);lastX=e.clientX});turn.addEventListener('pointermove',e=>{if(turn.hasPointerCapture(e.pointerId)&&lastX!==null){player.a+=(e.clientX-lastX)*.012;lastX=e.clientX}});turn.addEventListener('pointerup',()=>lastX=null);turn.addEventListener('pointercancel',()=>lastX=null);
function enemyTick(dt,now){if(gameOver)return;
 for(const t of targets){if(!t.alive)continue;
  const dx=player.x-t.x,dy=player.y-t.y,d=Math.hypot(dx,dy);
  if(d<9&&d>.8){const speed=.65*dt;const vx=dx/d*speed,vy=dy/d*speed;
   if(!solid(t.x+vx+Math.sign(vx)*.2,t.y))t.x+=vx;
   if(!solid(t.x,t.y+vy+Math.sign(vy)*.2))t.y+=vy;
  }
  if(d<1.05&&now>t.attack&&now>invulnUntil){health=Math.max(0,health-10);t.attack=now+1100;invulnUntil=now+650;updateHUD();if(health<=0){gameOver=true;document.getElementById('help').textContent='You were defeated. Tap RESET.';}}
 }
}
let last=performance.now();function frame(now){let dt=Math.min(.04,(now-last)/1000);last=now;let forward=(keys.has('KeyW')||keys.has('ArrowUp')?1:0)-(keys.has('KeyS')||keys.has('ArrowDown')?1:0)-joyY;let strafe=(keys.has('KeyD')?1:0)-(keys.has('KeyA')?1:0)+joyX;let mag=Math.max(1,Math.hypot(forward,strafe));forward/=mag;strafe/=mag;player.a+=((keys.has('ArrowRight')?1:0)-(keys.has('ArrowLeft')?1:0))*dt*2.2;let speed=dt*2.6;if(!gameOver)move((Math.cos(player.a)*forward-Math.sin(player.a)*strafe)*speed,(Math.sin(player.a)*forward+Math.cos(player.a)*strafe)*speed);if(!gameOver)tickProjectiles(dt);else projectiles=[];enemyTick(dt,now);render();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
